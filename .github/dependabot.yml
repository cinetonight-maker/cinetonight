version: 2
updates:
  # Free, built into GitHub — no signup, no dashboard to configure. Once
  # this file is pushed, GitHub automatically opens a pull request whenever
  # one of the npm packages this project depends on gets a security patch,
  # so vulnerabilities don't sit unnoticed the way they would on a site
  # nobody is actively maintaining full-time.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"